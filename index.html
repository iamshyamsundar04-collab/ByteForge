<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ByteForge - Lab Equipment Booking</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
  <meta name="theme-color" content="#0F3B4C">
  <meta name="description" content="Browse college lab equipment, read safety rules and book a 2-hour slot in the Physics, Electronics, Mechanical and IoT labs.">
  <meta property="og:type" content="website">
  <meta property="og:title" content="ByteForge: Lab Equipment Booking System">
  <meta property="og:description" content="Browse equipment. Read safety rules. Book a 2-hour slot.">
  <meta property="og:image" content="assets/thumbnail.png">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:image" content="assets/thumbnail.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
     <div class="header-inner">
      <a class="logo" href="index.html"><img src="assets/favicon.svg" alt="" width="34" height="34">ByteForge Labs</a>
      <nav>
        <a href="index.html" class="active">Equipment</a>
        <a href="booking.html">Book a Slot</a>
      </nav>
    </div>
  </header>

  <main>
    <section class="intro">
      <h1>College Science and Engineering Lab Equipment Booking System</h1>
      <p>Find equipment from the Physics, Electronics, Mechanical and IoT labs, read its safety rules, and reserve a 2-hour slot from one single place.</p>
    </section>

    <!-- Lab filter buttons and search box -->
    <section class="filters" id="filters">
      <button data-lab="All" class="active">All Labs</button>
      <button data-lab="Electronics">Electronics</button>
      <button data-lab="Physics">Physics</button>
      <button data-lab="Mechanical">Mechanical</button>
      <button data-lab="IoT">IoT</button>
      <input type="text" id="searchBox" placeholder="Search equipment..." aria-label="Search equipment">
    </section>

    <!-- Cards are added here by catalog.js -->
    <section class="grid" id="catalog"></section>
  </main>

  <footer>ByteForge - Internet Programming Project</footer>

  <script src="data.js"></script>
  <script src="catalog.js"></script>
</body>
</html>
